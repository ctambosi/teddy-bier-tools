name: bier-app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    networks:
      - bier_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - bier_net
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: teddy_bier_tools
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bier
      MYSQL_PASSWORD: bier
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s
    volumes:
      - bier_mysql_data:/var/lib/mysql
    networks:
      - bier_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
      interval: 10s
    volumes:
      - bier_redis_data:/data
    networks:
      - bier_net

networks:
  bier_net:
    driver: bridge

volumes:
  bier_mysql_data:
  bier_redis_data:
