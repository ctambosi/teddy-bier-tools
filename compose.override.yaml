name: bier-dev

services:
  app:
    build:
      target: dev
    restart: unless-stopped
    environment:
      - PHP_OPCACHE_ENABLE=0
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro

  nginx:
    ports:
      - "8010:80"
    volumes:
      - .:/var/www

  mysql:
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: teddy_bier_tools
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bier
      MYSQL_PASSWORD: bier

  redis:
    ports:
      - "6380:6379"

  node:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host; rm -f /var/www/public/hot"
    networks:
      - bier_net
